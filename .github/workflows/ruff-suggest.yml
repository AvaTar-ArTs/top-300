name: Ruff Suggest

on:
  push:
    branches:
      - feat/live-data-validation

jobs:
  suggest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.4
      - name: Show import-sort diff
        run: |
          ruff check src/top300/adapters/google_trends.py \
            src/top300/adapters/hacker_news.py \
            --select I001 --fix --diff || true
